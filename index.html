<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Training">
<meta name="theme-color" content="#0c1016">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}</style>
</head>
<body>
<title>Trainingsplan</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600;700&display=swap">
<style>
/* Layout: one narrow logbook column; sticky top bar, week strip, today card; fixed rest-timer dock; bottom sheets for info.
   Workouts A/B/C carry the competition plate colours (25 kg red, 20 kg blue, 15 kg yellow). */
:root{
  --bg:#eef1f5; --surface:#ffffff; --surface-2:#e5e9ef; --line:#d2d8e1;
  --fg:#121821; --muted:#5a6575;
  --accent:#1f5fbf; --accent-fg:#ffffff; --accent-soft:#dce7f8;
  --good:#1b7a45; --good-soft:#dcf1e5; --warn:#9a5600; --warn-soft:#fbecd6; --danger:#c62828;
  --plate-a:#c62828; --plate-b:#1f5fbf; --plate-c:#d19d00;
  --m-base:#d3d9e2; --m-sec:#9ab9ea;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0c1016; --surface:#151b24; --surface-2:#1e2632; --line:#2a3443;
  --fg:#e7ecf3; --muted:#94a1b3;
  --accent:#5b97f2; --accent-fg:#06101f; --accent-soft:#1a2b45;
  --good:#52c78a; --good-soft:#15301f; --warn:#eaa846; --warn-soft:#33260f; --danger:#ff5d52;
  --plate-a:#e24b4b; --plate-b:#5b97f2; --plate-c:#e9bd2c;
  --m-base:#2c3645; --m-sec:#4a70ab;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0c1016; --surface:#151b24; --surface-2:#1e2632; --line:#2a3443;
  --fg:#e7ecf3; --muted:#94a1b3;
  --accent:#5b97f2; --accent-fg:#06101f; --accent-soft:#1a2b45;
  --good:#52c78a; --good-soft:#15301f; --warn:#eaa846; --warn-soft:#33260f; --danger:#ff5d52;
  --plate-a:#e24b4b; --plate-b:#5b97f2; --plate-c:#e9bd2c;
  --m-base:#2c3645; --m-sec:#4a70ab;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:16px/1.45 var(--body);-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
body.lock{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3,h4{font-family:var(--display);font-weight:700;letter-spacing:.01em;margin:0;text-wrap:balance;line-height:1.1}
p{margin:0}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 170px}

.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;gap:10px;padding-block:12px;border-bottom:1px solid var(--line);margin-bottom:16px}
.bar h1{font-size:24px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .meta{font-size:13px;color:var(--muted)}
.ghost{background:none;border:0;padding:8px 10px;border-radius:10px;color:var(--accent);font-weight:600;white-space:nowrap}
.ghost:active{background:var(--surface-2)}
.brand{display:flex;align-items:center;gap:12px;flex:1;min-width:0}
.brand h1{font-size:24px}
.logo{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:var(--accent-fg);font:700 18px var(--display);flex:none;box-shadow:inset 0 0 0 4px rgb(255 255 255 / .2)}
.brand p{font-size:13px;color:var(--muted)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.stack{display:flex;flex-direction:column;gap:14px}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.note{font-size:13px;color:var(--muted)}

.plate{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font:700 24px var(--display);color:#fff;flex:none;box-shadow:inset 0 0 0 4px rgb(255 255 255 / .18)}
.pA{background:var(--plate-a)} .pB{background:var(--plate-b)} .pC{background:var(--plate-c);color:#1b1500}
.pX{background:var(--surface-2);color:var(--muted);font-size:15px}
.wk-head{display:flex;align-items:center;gap:12px}
.wk-head h2{font-size:30px}
.wk-head p{color:var(--muted)}

/* week strip */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.day{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:7px 2px;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0}
.day .d{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.day .k{font:700 16px var(--display);line-height:1.1}
.day .s{height:6px;width:6px;border-radius:50%;background:transparent}
.day.done .s{background:var(--good)}
.day.today{border:2px solid var(--accent);background:var(--accent-soft)}
.day .k.tA{color:var(--plate-a)} .day .k.tB{color:var(--plate-b)} .day .k.tC{color:var(--plate-c)}
.day .k.tX{font-size:12px;color:var(--muted);font-family:var(--body);font-weight:600;padding-top:2px}
button.day{font:inherit;color:inherit;cursor:pointer}
.day.trained{background:var(--good);border-color:var(--good)}
.day.trained .d,.day.trained .k{color:var(--surface)}
.day.trained.today{box-shadow:inset 0 0 0 2px var(--accent)}
.day.trained .s{background:var(--surface)}
.typegrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.typegrid button{border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:14px 6px;font:700 18px var(--display)}
.typegrid button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.logo svg{width:24px;height:24px}
.links.three{grid-template-columns:1fr 1fr 1fr}
.links.three .btn{padding:12px 6px}
.wcard{display:grid;grid-template-columns:1fr auto;gap:4px 12px;text-align:left;font:inherit;color:inherit;cursor:pointer;width:100%}
.wcard .eyebrow,.wcard .wcard-v,.wcard .note{grid-column:1}
.wcard-v{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.wcard-v b{font:700 26px var(--display)}
.wcard-v span{font-size:14px;color:var(--muted);font-weight:600}
.wcard-v span.good{color:var(--good)}
.wcard-go{grid-column:2;grid-row:1 / span 3;align-self:center;font-size:28px;color:var(--muted)}
.whero-top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.wbig{display:block;font:700 56px/1 var(--display)}
.wbig small{font-size:22px;color:var(--muted)}
.wdiff{text-align:right}
.wdiff b{display:block;font:700 28px var(--display)}
.wdiff span{font-size:13px;color:var(--muted)}
.wdiff.good b{color:var(--good)}
.goalbar{display:flex;flex-direction:column;gap:6px}
.goalbar-t{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.goalbar-b{height:14px;background:var(--surface-2);border-radius:7px;overflow:hidden}
.goalbar-b i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--good));border-radius:7px;transition:width .6s}
.goalbar-v{font-size:15px}
.trend .goal{stroke:var(--good);stroke-width:1.5;stroke-dasharray:5 4}
.trend .wdot{fill:var(--m-sec);stroke:var(--surface);stroke-width:1.5}
.beforeafter{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.beforeafter figure{margin:0;display:flex;flex-direction:column;gap:4px}
.beforeafter img,.pthumb img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:10px;background:var(--surface-2);display:block}
.beforeafter figcaption{font-size:12px;color:var(--muted)}
.beforeafter figcaption b{color:var(--fg)}
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pthumb{border:0;background:none;padding:0;display:flex;flex-direction:column;gap:3px;font-size:11px;color:var(--muted);cursor:pointer}
.pbig{width:100%;border-radius:12px;display:block}
.ci-row{display:flex;flex-direction:column;gap:6px}
.ci-q{font-size:14px;font-weight:600}
.ci-opts{display:flex;gap:6px;flex-wrap:wrap}
.ci-opts button{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-size:14px;font-weight:600;color:var(--fg)}
.ci-opts button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.ci-done{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:14px}
.insight{display:flex;flex-direction:column;gap:6px;border-left:4px solid var(--accent)}
.insight.warn{border-left-color:var(--warn)} .insight.good{border-left-color:var(--good)}
.insight > b{font:700 18px var(--display)}
.corr{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.corr-r{display:grid;grid-template-columns:120px 1fr 56px;gap:8px;align-items:center;font-size:13px}
.corr-b{height:10px;background:var(--surface-2);border-radius:5px;overflow:hidden}
.corr-b i{display:block;height:100%;border-radius:5px}
.corr-b i.pos{background:var(--good)} .corr-b i.neg{background:var(--warn)}
.corr-r b{text-align:right}
.hello-in .logo svg{width:30px;height:30px}

.plan-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.plan-list li{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:15px}
.plan-list li:last-child{border-bottom:0}
.plan-list .t{color:var(--muted);white-space:nowrap}
.ssmark{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--accent);background:var(--accent-soft);border-radius:6px;padding:1px 6px;margin-right:6px;vertical-align:1px}

.btn{border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:12px 16px;font-weight:600}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.big{width:100%;padding:16px;font-size:18px;font-family:var(--display);letter-spacing:.03em;text-transform:uppercase}
.btn.danger{color:var(--danger)}
.btn.good{background:var(--good);border-color:var(--good);color:var(--surface)}
.btn:disabled{opacity:.5}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row > .btn{flex:1}
.other{display:flex;gap:8px;align-items:center;color:var(--muted);font-size:14px;flex-wrap:wrap}
.other button{width:44px;height:44px;border-radius:50%;border:2px solid var(--line);background:var(--surface);font:700 18px var(--display)}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
.stat b{display:block;font:700 26px var(--display)}
.stat span{font-size:12px;color:var(--muted)}
.links{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.chip{display:inline-flex;gap:6px;align-items:center;font-size:13px;font-weight:600;border-radius:8px;padding:5px 9px}
.chip.info{background:var(--accent-soft);color:var(--accent)}
.chip.good{background:var(--good-soft);color:var(--good)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}

.quote{border-left:4px solid var(--accent);padding:4px 0 4px 14px}
.quote p{font-size:17px;font-weight:500;line-height:1.4}
.quote span{display:block;margin-top:6px;font-size:13px;color:var(--muted)}

.tips{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.tips li{display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start}
.tips .ic{width:28px;height:28px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font:700 14px var(--display)}
.tips b{display:block}
.tips span{font-size:14px;color:var(--muted)}
.flexlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.flexlist button{width:100%;display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:center;text-align:left;background:var(--surface-2);border:0;border-radius:12px;padding:10px 12px}
.flexlist .dot{width:30px;height:30px;font-size:14px}
.flexlist b{display:block;font-weight:600}
.flexlist span{font-size:13px;color:var(--muted)}
.flexlist button.done{background:var(--good-soft)}

/* body map */
.bodymap{width:100%;max-width:300px;height:auto;display:block;margin:0 auto}
.bodymap .b{fill:var(--m-base)}
.bodymap .p{fill:var(--accent)}
.bodymap .s{fill:var(--m-sec)}
.bodymap text{fill:var(--muted);font:600 9px var(--body);letter-spacing:.06em;text-transform:uppercase}
.legend{display:flex;gap:14px;justify-content:center;font-size:13px;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-1px}

/* session */
.ss{border-left:4px solid var(--accent);padding-left:10px;display:flex;flex-direction:column;gap:10px}
.ss-label{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.ex{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px;transition:background .3s,border-color .3s}
.ex.complete{background:var(--good-soft);border-color:var(--good)}
.ex-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.ex-head h3{font-size:22px;min-width:0}
.ex-sub{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.ex-sub .tgt{font-size:14px;color:var(--muted)}
.info-btn{flex:none;width:34px;height:34px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);color:var(--accent);font:700 16px Georgia,serif;font-style:italic}
.pdots{display:flex;gap:6px}
.pdot{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);background:var(--surface)}
.pdot.done{background:var(--good);border-color:var(--good)}
.last{font-size:14px;color:var(--muted)}
.last b{color:var(--fg);font-weight:600}
.seg{display:flex;background:var(--surface-2);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;border-radius:8px;padding:7px;font-size:14px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgb(0 0 0 / .15)}
.grp-l{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:2px}
.sets{display:flex;flex-direction:column;gap:8px}
.set{display:grid;grid-template-columns:48px 1fr auto 1fr;gap:8px;align-items:center}
.dot{width:48px;height:48px;border-radius:50%;border:2.5px solid var(--line);background:var(--surface);font:700 18px var(--display);color:var(--muted);display:grid;place-items:center;padding:0;line-height:1}
.dot small{display:block;font:700 8px var(--body);letter-spacing:.05em;text-transform:uppercase;color:var(--accent);margin-top:1px}
.dot.w{border-style:dashed;font-size:15px}
.set.done .dot,.flexlist .done .dot{background:var(--good);border-color:var(--good);border-style:solid;color:var(--surface)}
.set.done .dot small{color:var(--surface)}
.fld{display:flex;align-items:center;background:var(--surface-2);border:1px solid transparent;border-radius:10px;padding:0 10px;min-width:0}
.fld:focus-within{border-color:var(--accent)}
.fld input{width:100%;min-width:0;border:0;background:none;padding:11px 0;font-size:20px;font-weight:600;font-variant-numeric:tabular-nums;outline:none}
.fld input::placeholder{color:var(--muted);opacity:.6;font-weight:500}
.fld span{font-size:13px;color:var(--muted);margin-left:4px}
.set .x{color:var(--muted)}
.set.done .fld{background:var(--surface)}
.set.warm .fld input{font-size:17px}
.goal{font-size:15px;background:var(--surface-2);border-radius:10px;padding:8px 10px}
.goal b{font-weight:700}
.setwrap{display:flex;flex-direction:column;gap:4px}
.fb{font-size:13px;color:var(--muted);padding-left:56px;min-height:18px}
.fb.good{color:var(--good);font-weight:600}
.fb.info{color:var(--accent)}
.fb.warn{color:var(--warn);font-weight:600}
.xr{background:var(--surface-2);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px}
.xr-h{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.xr-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.xr-c{background:var(--surface);border:1.5px solid var(--line);border-radius:8px;padding:6px 2px;text-align:center;min-width:0}
.xr-c b{display:block;font:700 15px var(--display);font-variant-numeric:tabular-nums}
.xr-c span{display:block;font-size:11px;color:var(--muted);line-height:1.2}
.xr-c.on.good{background:var(--good);border-color:var(--good)}
.xr-c.on.info{background:var(--accent);border-color:var(--accent)}
.xr-c.on.warn{background:var(--warn);border-color:var(--warn)}
.xr-c.on b,.xr-c.on span{color:var(--surface)}
.xr-v{font-size:14px;font-weight:600;color:var(--muted)}
.xr-v.good{color:var(--good)} .xr-v.info{color:var(--accent)} .xr-v.warn{color:var(--warn)}
.addset.del{color:var(--danger)}
#motiv{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 166px);z-index:35;width:max-content;max-width:min(420px,calc(100% - 32px));background:var(--accent);color:var(--accent-fg);padding:10px 14px;border-radius:14px;font-weight:600;font-size:15px;line-height:1.35;box-shadow:0 8px 24px rgb(0 0 0 / .25);animation:pop .3s ease-out}
#exdone{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 166px);z-index:36;width:min(440px,calc(100% - 32px));background:var(--surface);border:2px solid var(--accent);color:var(--fg);padding:14px 16px;border-radius:16px;box-shadow:0 10px 30px rgb(0 0 0 / .3);display:flex;flex-direction:column;gap:4px;cursor:pointer;animation:pop .3s ease-out}
#exdone.ex-good{border-color:var(--good)} #exdone.ex-warn{border-color:var(--warn)}
#exdone b{font:700 20px var(--display)}
#exdone .exd-cmp{font-size:15px;font-weight:600;color:var(--accent)}
#exdone.ex-good .exd-cmp{color:var(--good)} #exdone.ex-warn .exd-cmp{color:var(--warn)}
#exdone .exd-say{font-size:15px;color:var(--muted)}
.set.pre:not(.done) input{color:var(--muted)}
.sugg-row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.sugg-row .addset{padding:0}
.cmp-inline{font-size:14px;font-weight:600;border-radius:10px;padding:8px 10px;background:var(--surface)}
.cmp-inline.good{color:var(--good)} .cmp-inline.warn{color:var(--warn)} .cmp-inline.info{color:var(--accent)}
#motiv span{display:block;margin-top:3px;font-weight:500;font-size:12px;opacity:.85}
@keyframes pop{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}
#hello{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;align-items:center;justify-content:center;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);animation:fade .35s ease-out}
@keyframes fade{from{opacity:0}to{opacity:1}}
.hello-in{max-width:440px;width:100%;display:flex;flex-direction:column;gap:16px}
.hello-in .logo{width:56px;height:56px;font-size:22px}
.hello-in h2{font-size:44px}
.hello-day{color:var(--muted);font-size:17px}
.hello-in blockquote{margin:12px 0;border-left:4px solid var(--accent);padding-left:16px;font-size:22px;line-height:1.35;font-weight:600}
.hello-in cite{display:block;margin-top:10px;font-style:normal;font-size:15px;font-weight:500;color:var(--muted)}
.sx{display:flex;flex-direction:column;gap:14px}
.sx-row{display:grid;grid-template-columns:minmax(0,1fr) 128px;gap:12px;align-items:end}
.sx-name b{display:block;font-weight:600;font-size:15px}
.sx-name span{font-size:12px;color:var(--muted)}
.sx-plot{position:relative;height:64px;display:flex;align-items:flex-end;gap:2px;border-bottom:1px solid var(--line)}
.sx-band{position:absolute;left:0;right:0;background:var(--accent-soft);border-radius:3px}
.sx-bar{position:relative;flex:1;max-width:30px;background:var(--m-sec);border-radius:4px 4px 0 0;min-height:4px}
.sx-bar.hit{background:var(--accent)}
.sx-bar em{position:absolute;top:-17px;left:0;right:0;text-align:center;font:600 12px var(--body);font-style:normal;color:var(--fg)}
.trend{width:100%;height:auto;display:block}
.trend .grid{stroke:var(--line);stroke-width:1}
.trend .ax{fill:var(--muted);font:500 10px var(--body)}
.trend .val{fill:var(--fg);font:700 12px var(--body)}
.trend .area{fill:var(--accent-soft)}
.trend .line{fill:none;stroke:var(--accent);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.trend .pt{fill:var(--accent);stroke:var(--surface);stroke-width:2}
.hero b{display:block;font:700 40px var(--display)}
.hero span{font-size:14px;color:var(--muted)}
.cmp{display:flex;flex-direction:column}
.cmp-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.cmp-row:last-child{border-bottom:0}
.cmp-row div{min-width:0}
.cmp-row b{display:block;font-weight:600;font-size:15px}
.cmp-row span.num{font-size:12px;color:var(--muted)}
.cmp-row .chip{flex:none}
.addset{align-self:flex-start;background:none;border:0;color:var(--accent);font-weight:600;padding:4px 0;font-size:14px}
.addrow{display:flex;gap:16px;flex-wrap:wrap}
.panel{border:2px solid var(--accent);background:var(--surface);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px}

/* timer dock */
#dock{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);box-shadow:0 -6px 24px rgb(0 0 0 / .12);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-top:10px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px))}
.dock-in{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
.t-main{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
#t-label{font-size:14px;color:var(--muted);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#t-time{font:700 42px/1 var(--display);font-variant-numeric:tabular-nums}
.t-bar{height:6px;background:var(--surface-2);border-radius:3px;overflow:hidden}
#t-fill{display:block;height:100%;width:0;background:var(--accent);transition:width .25s linear}
#dock.low #t-time{color:var(--danger)}
#dock.low #t-fill{background:var(--danger)}
#dock.low{border-top-color:var(--danger)}
#dock.over #t-fill{background:var(--good)}
#dock.over #t-time{color:var(--good)}
.t-btns{display:grid;grid-template-columns:1fr 1fr 1.4fr;gap:8px}
.t-btns button{border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:10px;font-weight:600}
.t-btns button:last-child{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}

#toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 64px);z-index:40;background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:15px;max-width:calc(100% - 32px);box-shadow:0 6px 20px rgb(0 0 0 / .25)}

/* sheet */
#sheet{position:fixed;inset:0;z-index:30;background:rgb(0 0 0 / .45);display:flex;align-items:flex-end;justify-content:center}
.sheet-in{background:var(--bg);width:100%;max-width:600px;max-height:90%;overflow-y:auto;-webkit-overflow-scrolling:touch;border-radius:20px 20px 0 0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-top:8px;padding-bottom:calc(24px + env(safe-area-inset-bottom,0px))}
.sheet-top{position:sticky;top:0;background:var(--bg);display:flex;align-items:center;gap:10px;padding:10px 0;z-index:1}
.sheet-top h2{flex:1;font-size:26px;min-width:0}
.sheet-in ul.cues{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.sheet-in h4{font-size:18px;margin-bottom:6px}

/* history */
.tabs{display:flex;background:var(--surface-2);border-radius:12px;padding:4px;gap:4px}
.tabs button{flex:1;border:0;background:none;border-radius:9px;padding:9px;font-weight:600;color:var(--muted)}
.tabs button[aria-pressed="true"]{background:var(--surface);color:var(--fg)}
details.sess{background:var(--surface);border:1px solid var(--line);border-radius:12px}
details.sess summary{list-style:none;display:flex;gap:12px;align-items:center;padding:12px;cursor:pointer}
details.sess summary::-webkit-details-marker{display:none}
details.sess .plate{width:36px;height:36px;font-size:19px}
.sess-t{flex:1;min-width:0}
.sess-t b{display:block}
.sess-t span{font-size:13px;color:var(--muted)}
.sess-body{padding:0 12px 12px;display:flex;flex-direction:column;gap:6px;font-size:14px}
.sess-body .l{display:flex;justify-content:space-between;gap:10px;border-top:1px solid var(--line);padding-top:6px}
.sess-body .l span:last-child{color:var(--muted);text-align:right}
.exlist{display:flex;flex-direction:column;gap:8px}
.exitem{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;grid-template-columns:1fr 110px;gap:4px 12px;align-items:center}
.exitem b{font-weight:600}
.exitem span{font-size:13px;color:var(--muted)}
.exitem svg{grid-row:1 / span 2;grid-column:2;width:110px;height:34px}

/* settings */
.set-group{display:flex;flex-direction:column;gap:12px}
.field{display:flex;justify-content:space-between;align-items:center;gap:12px}
.field label{flex:1}
.field small{display:block;color:var(--muted);font-size:13px}
.field select,.field input[type=number]{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:9px 10px;font-size:16px;max-width:160px}
.field input[type=number]{width:90px}
textarea{width:100%;min-height:110px;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px;font:13px/1.4 ui-monospace,Menlo,monospace}
ol.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:15px}
.sum-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}

@media (prefers-reduced-motion: reduce){*{transition:none!important;scroll-behavior:auto!important}}

const KEY = 'xplode-oberkoerper-v1';
const DEF = {phase:'auto', restMain:90, restIso:60, restSS:60, sound:true, schedule:['A','cardio','B','flex','C','cardio','rest'], v:2, theme:'auto', autoBackup:true, setQuotes:true};

function normalize(d){
  d = d && typeof d === 'object' ? d : {};
  const old = d.settings || {};
  const st = Object.assign({}, DEF, old);
  if(old.v !== 2){ st.restMain = 90; st.restIso = 60; st.restSS = 60; st.v = 2; }
  st.variants = Object.assign({}, old.variants || {});
  if(!Array.isArray(st.schedule) || st.schedule.length !== 7) st.schedule = DEF.schedule.slice();
  const active = d.active || null;
  if(active && Array.isArray(active.items)){
    for(const e of active.items){
      if(e.warm && typeof e.warm[0] === 'boolean') e.warm = WARM.map((w, i) => ({kg:null, reps:w.r, done:e.warm[i], auto:true}));
    }
  }
  return {sessions: Array.isArray(d.sessions) ? d.sessions : [], active, settings: st, deloads: d.deloads || {}, startDate: d.startDate || null, days: d.days || {}, lastBackup: d.lastBackup || null,
    weekPlan: d.weekPlan || {}, weights: Array.isArray(d.weights) ? d.weights : [], weightGoal: d.weightGoal || null,
    photos: Array.isArray(d.photos) ? d.photos : [], hintsHidden: d.hintsHidden || {}};
}

function unwrapBackup(raw){
  const d = raw && raw.data && Array.isArray(raw.data.sessions) ? raw.data : raw;
  if(!d || !Array.isArray(d.sessions)) throw new Error('invalid');
  return d;
}
function load(){

}

const fmt = x => (Math.round(x * 100) / 100).toLocaleString('de-DE');
const roundStep = (x, step) => +(Math.round(x / step) * step).toFixed(2);

const dayStart = ts => { const d = new Date(ts); d.setHours(0,0,0,0); return d.getTime(); };
const dateKey = ts => { const d = new Date(ts); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
const fmtDate = ts => new Date(ts).toLocaleDateString('de-DE', {weekday:'short', day:'2-digit', month:'2-digit'});

/* ---------- History & progression ---------- */
function histFor(exId){
  const out = [];
  for(const s of S.sessions){
    for(const e of s.entries){
      if(e.exId !== exId) continue;
      const done = e.sets.filter(x => x.done && x.reps > 0);
      if(done.length) out.push({date: s.end || s.start, sets: done});
    }
  }
  return out.sort((a, b) => a.date - b.date);
}
function perf(sets){
  let maxKg = 0, total = 0, e1 = 0;
  for(const x of sets){ maxKg = Math.max(maxKg, x.kg || 0); total += x.reps; e1 = Math.max(e1, (x.kg || 0) * (1 + x.reps / 30)); }
  return {maxKg, total, e1};
}
function better(a, b){ return a.maxKg > b.maxKg + 1e-9 || (Math.abs(a.maxKg - b.maxKg) < 1e-9 && a.total > b.total); }
function plateau(exId){
  const since = S.deloads[exId] || 0;
  const h = histFor(exId).filter(x => x.date > since).map(x => perf(x.sets));
  if(h.length < 4) return false;
  let best = h[0], stale = 0;
  for(let i = 1; i < h.length; i++){ if(better(h[i], best)){ best = h[i]; stale = 0; } else stale++; }
  return stale >= 3 && best.maxKg > 0;
}
function suggest(it, ex){
  const h = histFor(ex.id);
  if(!h.length){
    return {kg:null, last:null, tone:'info', first:true, text:''};
  }
  const last = h[h.length - 1], p = perf(last.sets), w = p.maxKg;
  const reps = last.sets.map(x => x.reps);
  const lastTxt = fmt(w) + ' kg · ' + reps.join('/');
  const step = it.inc || 2.5;
  if(plateau(ex.id)){
    const d = Math.max(0, roundStep(w * 0.8, step >= 2.5 ? 2.5 : step));
    return {kg:d, last:lastTxt, date:last.date, tone:'warn', text:'3 Einheiten ohne Fortschritt: 20 % Deload auf ' + fmt(d) + ' kg, dann wieder hocharbeiten.'};
  }
  if(it.amrap){
    const r = reps[reps.length - 1];
    let d = 0;
    if(r < 4) d = -2.5; else if(r <= 7) d = 0; else if(r <= 9) d = 2.5; else if(r <= 11) d = 5; else d = 7.5;
    const t = d > 0 ? 'Letzter Satz ' + r + ' Wdh: heute +' + fmt(d) + ' kg'
            : d < 0 ? 'Letzter Satz ' + r + ' Wdh: heute 2,5 kg weniger'
            : 'Letzter Satz ' + r + ' Wdh: Gewicht halten';
    return {kg:Math.max(0, w + d), last:lastTxt, date:last.date, text:t, tone: d > 0 ? 'good' : d < 0 ? 'warn' : 'info'};
  }
  const allTop = last.sets.length >= Math.min(2, it.sets) && last.sets.every(x => x.reps >= it.max);
  if(allTop) return {kg:+(w + step).toFixed(2), last:lastTxt, date:last.date, tone:'good', text:'Alle Sätze bei ' + it.max + ' Wdh: heute +' + fmt(step) + ' kg'};
  return {kg:w, last:lastTxt, date:last.date, tone:'info', text:'Gewicht halten, bis alle Sätze ' + it.max + ' Wdh schaffen.'};
}

/* ---------- Session ---------- */
/* Last session in which this exercise was actually done (skipped sessions are ignored) */
function lastEntry(exId){
  for(let i = S.sessions.length - 1; i >= 0; i--){
    const e = S.sessions[i].entries.find(x => x.exId === exId && x.sets.some(s => s.done && s.reps > 0));
    if(e) return e;
  }
  return null;
}
function buildEntry(it, idx, phase){
  const ex = exOf(it);
  const sg = suggest(it, ex);
  const le = lastEntry(ex.id);
  const prev = le ? le.sets.filter(s => s.done && s.reps > 0) : [];
  const n = setsFor(it, phase);
  const pick = i => prev[i] || prev[prev.length - 1] || null;
  const baseKg = prev.length ? pick(0).kg : sg.kg;
  const lastWarm = le && le.warm && le.warm.length ? le.warm : null;
  const warmDefs = it.warmup ? WARM : [{p:.5, r:12}];
  return {
    slot: idx, exId: ex.id, name: ex.name, hint: ex.hint || '', sugg: sg,
    prevSets: prev.map(s => ({kg: s.kg, reps: s.reps})),
    sets: Array.from({length:n}, (_, i) => {
      const p = pick(i);
      return {kg: p ? p.kg : sg.kg, reps: p ? p.reps : null, done: false, pre: !!p, ph: p ? p.reps : null};
    }),
    warm: lastWarm
      ? lastWarm.map((w, i) => ({kg: w.kg, reps: w.reps, done: false, auto: false, p: warmDefs[i] ? warmDefs[i].p : null}))
      : warmDefs.map(w => ({kg: warmKg(baseKg, w.p, it), reps: w.r, done: false, auto: true, p: w.p}))
  };
}
function compareSets(now, prev){
  const done = now.filter(s => s.done && s.reps > 0).map(s => ({kg: num(s.kg) || 0, reps: s.reps}));
  if(!done.length) return null;
  if(!prev || !prev.length) return {tone:'info', dir:0, text:'Erste Werte gespeichert. Ab dem nächsten Mal siehst du hier deinen Vergleich.'};
  const a = perf(done), b = perf(prev);
  const was = fmt(b.maxKg) + ' kg · ' + prev.map(x => x.reps).join('/');
  if(a.maxKg > b.maxKg + 1e-9) return {tone:'good', dir:1, text:'+' + fmt(a.maxKg - b.maxKg) + ' kg gegenüber letztem Mal (' + was + ')'};
  if(a.maxKg < b.maxKg - 1e-9) return {tone:'warn', dir:-1, text:fmt(a.maxKg - b.maxKg) + ' kg gegenüber letztem Mal (' + was + ')'};
  if(a.total > b.total) return {tone:'good', dir:1, text:'+' + (a.total - b.total) + ' Wdh gegenüber letztem Mal (' + was + ')'};
  if(a.total < b.total) return {tone:'warn', dir:-1, text:(a.total - b.total) + ' Wdh gegenüber letztem Mal (' + was + ')'};
  return {tone:'info', dir:0, text:'Genau wie letztes Mal (' + was + ')'};
}
function startSession(wk){
  const phase = effectivePhase();
  S.active = {id:'s' + Date.now(), wk, start: Date.now(), phase, items: PLAN[wk].items.map((it, i) => buildEntry(it, i, phase)), timer:null};
  confirmKey = null;
  save(); view = 'session'; render(); window.scrollTo(0, 0); requestWake(); unlockAudio();
}
function itemOf(entry){ return PLAN[S.active.wk].items[entry.slot]; }
function openSets(){ let n = 0; for(const e of S.active.items) for(const s of e.sets) if(!s.done) n++; return n; }
function firstOpen(){
  const a = S.active;
  for(let ei = 0; ei < a.items.length; ei++){ const si = a.items[ei].sets.findIndex(s => !s.done); if(si >= 0) return {ei, si}; }
  return null;
}
function partnerOf(ei){
  const a = S.active, it = itemOf(a.items[ei]);
  if(!it.ss) return -1;
  for(let j = 0; j < a.items.length; j++) if(j !== ei && itemOf(a.items[j]).ss === it.ss) return j;
  return -1;
}
function toggleSet(ei, si){
  const a = S.active, e = a.items[ei], s = e.sets[si], it = itemOf(e);
  if(s.done){ s.done = false; save(); render(); return; }
  if(s.reps == null) s.reps = s.ph != null ? s.ph : it.min;
  if(s.kg == null) s.kg = 0;
  s.done = true; s.pre = false;
  markActivity(ei);
  if(e.sets.every(x => x.done)) showExerciseDone(e);
  else if(S.settings.setQuotes) showMotiv();
  const pj = partnerOf(ei);
  if(pj >= 0 && a.items[pj].sets[si] && !a.items[pj].sets[si].done){
    a.timer = null;
    toast('Direkt weiter: ' + a.items[pj].name + ', Satz ' + (si + 1));
    save(); render(); scrollToEntry(pj);
    return;
  }
  const nx = firstOpen();
  if(!nx){ a.timer = null; save(); render(); toast('Alle Sätze erledigt. Stark!'); return; }
  const secs = restFor(it);
  a.timer = {end: Date.now() + secs * 1000, total: secs, label: 'Pause · danach ' + a.items[nx.ei].name + ', Satz ' + (nx.si + 1), fired:false};
  save(); render();
  if(nx.ei !== ei) scrollToEntry(nx.ei);
}
function toggleWarm(ei, wi){
  const w = S.active.items[ei].warm[wi];
  if(!w.done){ if(w.reps == null) w.reps = 5; if(w.kg == null) w.kg = 0; }
  w.done = !w.done; if(w.done) markActivity(ei); save(); render();
}
function finishSession(){
  const a = S.active;
  const prevBest = {}, prevLast = {};
  for(const e of a.items){ const h = histFor(e.exId); prevBest[e.exId] = h.length ? Math.max(...h.map(x => perf(x.sets).e1)) : null; prevLast[e.exId] = h.length ? h[h.length - 1].sets : null; }
  const sess = {
    id: a.id, wk: a.wk, start: a.start, end: Date.now(), phase: a.phase, checkin: a.checkin || null,
    entries: a.items.map(e => ({exId: e.exId, name: e.name, dur: e.sets.some(x => x.done) ? durOf(e) : null,
      warm: (e.warm || []).filter(w => w.done).map(w => ({kg: num(w.kg) || 0, reps: num(w.reps) || 0})),
      sets: e.sets.map(s => ({kg: num(s.kg) || 0, reps: num(s.reps) || 0, done: !!s.done}))}))
  };
  S.sessions.push(sess);
  if(!S.startDate) S.startDate = a.start;
  let sets = 0, vol = 0; const prs = [];
  for(const e of sess.entries){
    const done = e.sets.filter(s => s.done && s.reps > 0);
    sets += done.length;
    for(const s of done) vol += s.kg * s.reps;
    if(done.length && prevBest[e.exId] != null && perf(done).e1 > prevBest[e.exId] + 0.01 && !prs.includes(e.name)) prs.push(e.name);
  }
  const rows = [];
  sess.entries.forEach((e, i) => {
    const done = e.sets.filter(s => s.done && s.reps > 0);
    if(!done.length) return;
    const it = PLAN[a.wk].items[a.items[i].slot];
    rows.push({name: e.name, min: it.min, max: it.max || null, amrap: !!it.amrap, sets: done, prev: prevLast[e.exId]});
  });
  const mainId = a.items[0].exId;
  const trend = histFor(mainId).map(x => ({date: x.date, v: perf(x.sets).e1, top: x.sets.reduce((b, s) => s.kg * (1 + s.reps / 30) > b.kg * (1 + b.reps / 30) ? s : b, x.sets[0])})).slice(-12);
  const durs = sess.entries.filter(e => e.dur > 0).map(e => ({name: e.name, dur: e.dur, avg: avgDur(e.exId)}));
  summary = {wk: a.wk, mins: Math.round((sess.end - sess.start) / 60000), sets, vol, prs, rows, trend, mainName: a.items[0].name, durs, rpe: a.checkin && a.checkin.rpe ? +a.checkin.rpe : null};
  S.active = null; confirmKey = null;
  save(); view = 'summary'; render(); window.scrollTo(0, 0); releaseWake();
  if(S.settings.autoBackup && !embedded) shareBackup();
}

/* ---------- Backup (Web Share API with download fallback) ---------- */
const embedded = (() => { try{ return window.top !== window.self; }catch(e){ return true; } })();
function backupJson(){
  const data = Object.assign({}, S, {active: null, photoData: Object.assign({}, photoData)});
  return JSON.stringify({app:'xplode-oberkoerper', version:2, exported:new Date().toISOString(), data});
}
function downloadFile(name, txt){
  const blob = new Blob([txt], {type:'application/json'});
  const url = URL.createObjectURL(blob), l = document.createElement('a');
  l.href = url; l.download = name; l.rel = 'noopener';
  document.body.appendChild(l); l.click(); l.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}
/* Must be called directly from a tap handler: iOS only opens the share sheet during a user gesture. */
function shareBackup(){
  const name = 'training-backup-' + dateKey(Date.now()) + '.json';
  const txt = backupJson();
  const done = msg => { S.lastBackup = Date.now(); save(); toast(msg); if(view === 'settings') render(); };
  if(embedded){ toast('Datei-Backup klappt nur in der installierten App. Hier: „Backup kopieren“.'); return; }
  let file = null;
  try{
    for(const type of ['application/json', 'text/plain']){
      const f = new File([txt], name, {type});
      if(navigator.canShare && navigator.canShare({files:[f]})){ file = f; break; }
    }
  }catch(e){ file = null; }
  if(file && navigator.share){
    navigator.share({files:[file], title:'Trainings-Backup'})
      .then(() => done('Backup gesichert'))
      .catch(err => {
        if(err && err.name === 'AbortError'){ toast('Backup übersprungen'); return; }
        try{ downloadFile(name, txt); done('Backup heruntergeladen'); }catch(e){ toast('Backup nicht möglich. Nutze „Backup kopieren“.'); }
      });
    return;
  }
  try{ downloadFile(name, txt); done('Backup heruntergeladen'); }catch(e){ toast('Backup nicht möglich. Nutze „Backup kopieren“.'); }
}

/* ---------- Audio, wake lock, toast, sheet ---------- */
let actx = null;
function unlockAudio(){
  try{
    if(!actx){ const C = window.AudioContext || window.webkitAudioContext; if(C) actx = new C(); }
    if(actx && actx.state === 'suspended') actx.resume();
  }catch(e){}
}
function tone(freq, start, dur, vol){
  if(!actx || !S.settings.sound) return;
  try{
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = 'sine'; o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, actx.currentTime + start);
    g.gain.exponentialRampToValueAtTime(vol, actx.currentTime + start + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + start + dur);
    o.connect(g); g.connect(actx.destination);
    o.start(actx.currentTime + start); o.stop(actx.currentTime + start + dur + 0.05);
  }catch(e){}
}
function alarm(){
  tone(880, 0, .18, .5); tone(880, .25, .18, .5); tone(1320, .5, .35, .6);
  try{ if(navigator.vibrate) navigator.vibrate([200, 100, 200]); }catch(e){}
}

/* ---------- Timer loop ---------- */
let lastBeep = null;
function tick(){
  const a = S.active;
  const el = document.getElementById('elapsed');
  if(a && el) el.textContent = mmss((Date.now() - a.start) / 1000);
  const dock = $('#dock');
  const t = a && a.timer;
  if(!t || view !== 'session'){ dock.hidden = true; return; }
  dock.hidden = false;
  const rem = Math.ceil((t.end - Date.now()) / 1000);
  $('#t-label').textContent = t.label;
  if(rem > 0){
    dock.classList.remove('over');
    dock.classList.toggle('low', rem <= 10);
    $('#t-time').textContent = mmss(rem);
    $('#t-fill').style.width = Math.min(100, (1 - rem / t.total) * 100) + '%';
    if(rem <= 3 && lastBeep !== rem){ lastBeep = rem; tone(660, 0, .08, .25); }
  }else{
    dock.classList.remove('low'); dock.classList.add('over');
    $('#t-time').textContent = 'Los!';
    $('#t-fill').style.width = '100%';
    if(!t.fired){ t.fired = true; save(); alarm(); }
    if(Date.now() - t.end > 30000){ a.timer = null; save(); }
  }
}
setInterval(tick, 250);

/* ---------- Photos (IndexedDB, mirrored in memory so backups stay synchronous) ---------- */
const photoData = {};
const PDB = {
  db: null,
  open(){ if(!this.db) this.db = new Promise((res, rej) => { try{ const r = indexedDB.open('trainingsplan-fotos', 1); r.onupgradeneeded = () => r.result.createObjectStore('photos'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }catch(e){ rej(e); } }); return this.db; },
  async tx(mode, fn){ const db = await this.open(); return new Promise((res, rej) => { const t = db.transaction('photos', mode); const out = fn(t.objectStore('photos')); t.oncomplete = () => res(out && out.result); t.onerror = () => rej(t.error); }); },
  put(id, data){ return this.tx('readwrite', s => s.put(data, id)); },
  del(id){ return this.tx('readwrite', s => s.delete(id)); },
  get(id){ return this.tx('readonly', s => s.get(id)); }
};
async function loadPhotos(){
  for(const p of S.photos){ if(photoData[p.id]) continue; try{ const d = await PDB.get(p.id); if(d) photoData[p.id] = d; }catch(e){} }
  if(view === 'weight') render();
}
function resizeImage(file){
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const max = 1080, sc = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width * sc); c.height = Math.round(img.height * sc);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg', 0.8));
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('img')); };
    img.src = url;
  });
}
async function addPhoto(file){
  try{
    const data = await resizeImage(file);
    const id = 'p' + Date.now();
    await PDB.put(id, data); photoData[id] = data;
    const w = S.weights[S.weights.length - 1];
    S.photos.push({id, date: Date.now(), kg: w ? w.kg : null});
    save(); render(); toast('Foto gespeichert');
  }catch(e){ toast('Foto konnte nicht gespeichert werden.'); }
}

/* ---------- Weight ---------- */
function weightStats(){
  const w = S.weights;
  if(!w.length) return null;
  const cur = w[w.length - 1], first = w[0];
  /* rate per week from entries of the last 14 days (needs at least 7 days of span) */
  const recent = w.filter(x => x.date >= Date.now() - 15 * 864e5);
  let rate = null;
  if(recent.length >= 2){
    const span = (recent[recent.length - 1].date - recent[0].date) / (7 * 864e5);
    if(span >= 1){
      const avg = arr => arr.reduce((s, x) => s + x.kg, 0) / arr.length;
      const half = Math.ceil(recent.length / 2);
      const a = avg(recent.slice(0, half)), b = avg(recent.slice(-half));
      rate = (b - a) / Math.max(span / 2, 0.5);
    }
  }
  return {cur, first, diff: cur.kg - first.kg, rate, ratePct: rate != null ? rate / cur.kg * 100 : null};
}
function weightChart(){
  const w = S.weights.slice(-60);
  if(w.length < 2) return '<p class="note">Ab dem zweiten Eintrag siehst du hier deine Kurve.</p>';
  const W = 320, H = 180, L = 36, R = 12, T = 14, B = 26;
  const ma = w.map((p, i) => { const win = w.filter(q => q.date <= p.date && q.date > p.date - 7 * 864e5); return win.reduce((s, q) => s + q.kg, 0) / win.length; });
  const vals = w.map(p => p.kg).concat(S.weightGoal ? [S.weightGoal] : []);
  let lo = Math.floor(Math.min(...vals) - 0.5), hi = Math.ceil(Math.max(...vals) + 0.5);
  const t0 = w[0].date, t1 = w[w.length - 1].date;
  const x = d => L + (d - t0) / (t1 - t0 || 1) * (W - L - R);
  const y = v => T + (1 - (v - lo) / (hi - lo)) * (H - T - B);
  const ticks = [lo, (lo + hi) / 2, hi];
  let s = '<svg class="trend" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Gewichtsverlauf von ' + fmt(w[0].kg) + ' auf ' + fmt(w[w.length - 1].kg) + ' kg">';
  s += ticks.map(t => '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + y(t).toFixed(1) + '" y2="' + y(t).toFixed(1) + '" class="grid"/><text x="' + (L - 6) + '" y="' + (y(t) + 3.5).toFixed(1) + '" text-anchor="end" class="ax">' + fmt(Math.round(t * 10) / 10) + '</text>').join('');
  if(S.weightGoal) s += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + y(S.weightGoal).toFixed(1) + '" y2="' + y(S.weightGoal).toFixed(1) + '" class="goal"/><text x="' + (W - R) + '" y="' + (y(S.weightGoal) - 5).toFixed(1) + '" text-anchor="end" class="ax">Ziel ' + fmt(S.weightGoal) + '</text>';
  s += w.map(p => '<circle cx="' + x(p.date).toFixed(1) + '" cy="' + y(p.kg).toFixed(1) + '" r="4" class="wdot"><title>' + fmtDate(p.date) + ': ' + fmt(p.kg) + ' kg</title></circle>').join('');
  s += '<path d="' + ma.map((v, i) => (i ? 'L' : 'M') + x(w[i].date).toFixed(1) + ' ' + y(v).toFixed(1)).join(' ') + '" class="line"/>';
  s += '<text x="' + L + '" y="' + (H - 6) + '" class="ax">' + fmtDate(t0) + '</text><text x="' + (W - R) + '" y="' + (H - 6) + '" text-anchor="end" class="ax">' + fmtDate(t1) + '</text></svg>';
  s += '<div class="legend"><span><i style="background:var(--m-sec);border-radius:50%"></i>Messwert</span><span><i style="background:var(--accent);height:3px;vertical-align:3px"></i>7-Tage-Schnitt</span>' + (S.weightGoal ? '<span><i style="background:none;border-top:2px dashed var(--good);height:0;vertical-align:3px"></i>Ziel</span>' : '') + '</div>';
  return s;
}

function markActivity(ei){

  if(!e.t0){

    if(pj >= 0 && a.items[pj].t0) e.t0 = a.items[pj].t0;
    else { const prev = a.lastAct || a.start; e.t0 = (now - prev) < 15 * 60e3 ? prev : now - 60e3; }
  }
  e.t1 = now; a.lastAct = now;
}
function durOf(e){ return e.t0 && e.t1 ? Math.round((e.t1 - e.t0) / 1000) : null; }
function avgDur(exId){
  const d = [];
  for(const s of S.sessions) for(const e of s.entries) if(e.exId === exId && e.dur > 0) d.push(e.dur);
  return d.length ? {avg: Math.round(d.reduce((x, y) => x + y, 0) / d.length), n: d.length} : null;
}

/* ---------- Pattern detection ----------
   Rules are pragmatic, based on: adults need >= 7 h sleep (AASM/SRS consensus 2015);
   several nights of short sleep reduce strength in compound lifts (Knowles et al. 2018);
   weight loss of ~0.5–1 % body weight per week best preserves muscle (Helms et al. 2014, Garthe et al. 2011).
   A hint appears only with at least 3 check-ins in the last 14 days and at least half of them affected. */
function recentCheckins(days){
  return S.sessions.filter(s => s.checkin && s.start >= Date.now() - days * 864e5).map(s => s.checkin);
}
function sessionScore(sess){
  /* average % change of the estimated max vs the previous time per exercise */
  const idx = S.sessions.indexOf(sess); let sum = 0, n = 0;
  for(const e of sess.entries){
    const done = e.sets.filter(x => x.done && x.reps > 0); if(!done.length) continue;
    for(let i = idx - 1; i >= 0; i--){
      const pe = S.sessions[i].entries.find(x => x.exId === e.exId && x.sets.some(y => y.done && y.reps > 0));
      if(pe){
        const a = perf(done), b = perf(pe.sets.filter(y => y.done && y.reps > 0));
        const va = a.maxKg > 0 ? a.e1 : a.total, vb = b.maxKg > 0 ? b.e1 : b.total;
        if(vb > 0){ sum += (va / vb - 1) * 100; n++; }
        break;
      }
    }
  }
  return n ? sum / n : null;
}
function insights(){
  const out = [], ci = recentCheckins(14), n = ci.length;
  if(n >= 3){
    const short = ci.filter(sleepShort).length, veryShort = ci.filter(c => c.sleep === 'u6').length;
    if(short / n >= 0.5) out.push({key:'sleep', tone:'warn', title:'Du schläfst oft zu wenig',
      text:'Bei ' + short + ' von ' + n + ' Trainings in den letzten 2 Wochen hattest du unter 7 Stunden Schlaf' + (veryShort >= 2 ? ', ' + veryShort + '× sogar unter 6' : '') + '. Empfohlen sind mindestens 7 Stunden. Mehrere kurze Nächte am Stück senken nachweislich deine Kraft bei Übungen wie Bankdrücken und bremsen die Erholung.',
      tip:'Feste Schlafenszeit, Handy 30 Minuten vorher weg, Schlafzimmer kühl und dunkel.'});
    const low = ci.filter(c => c.food === 'low').length;
    if(low / n >= 0.5) out.push({key:'food', tone:'warn', title:'Du isst vor dem Training oft zu wenig',
      text:'Bei ' + low + ' von ' + n + ' Trainings hast du „zu wenig gegessen“ angegeben. Beim Abnehmen ist ein leichtes Defizit richtig. Fühlst du dich aber oft leer, ist das Defizit meist zu groß, und das kostet Kraft und Muskeln.',
      tip:'1–3 Stunden vor dem Training eine Mahlzeit mit Kohlenhydraten und Eiweiß, z. B. Haferflocken mit Skyr.'});
    const tired = ci.filter(c => c.energy === 'tired').length;
    if(tired / n >= 0.5 && !out.some(x => x.key === 'sleep')) out.push({key:'energy', tone:'info', title:'Du startest oft müde',
      text:'Bei ' + tired + ' von ' + n + ' Trainings hast du dich müde gefühlt. Achte auf Schlaf, Essen und Stress. Wenn das länger so bleibt, kann eine leichtere Woche (Deload) helfen.', tip:''});
  }
  const ws = weightStats();
  if(ws && ws.ratePct != null && ws.ratePct <= -1.0) out.push({key:'wrate', tone:'warn', title:'Du nimmst sehr schnell ab',
    text:'Zuletzt etwa ' + fmt(Math.round(Math.abs(ws.rate) * 10) / 10) + ' kg pro Woche (' + fmt(Math.round(Math.abs(ws.ratePct) * 10) / 10) + ' % deines Gewichts). Über 1 % pro Woche verlierst du leichter Muskeln. Ideal sind etwa 0,5–1 %.',
    tip:'Etwas mehr essen, vor allem Eiweiß, und weiter schwer trainieren.'});
  return out.filter(x => !(S.hintsHidden[x.key] && Date.now() - S.hintsHidden[x.key] < 7 * 864e5));
}

    (dismiss ? '<button class="addset" data-act="hidehint" data-k="' + x.key + '">Für 7 Tage ausblenden</button>' : '') + '</section>';

function correlationHtml(){
  const rows = S.sessions.filter(s => s.checkin && s.checkin.sleep).map(s => ({short: sleepShort(s.checkin), food: s.checkin.food, score: sessionScore(s), rpe: s.checkin.rpe ? +s.checkin.rpe : null})).filter(r => r.score != null);
  const grp = (f) => { const g = rows.filter(f); return g.length >= 3 ? {n: g.length, avg: g.reduce((x, r) => x + r.score, 0) / g.length} : null; };
  const pairs = [
    ['Schlaf', grp(r => !r.short), grp(r => r.short), 'ab 7 h', 'unter 7 h'],
    ['Essen', grp(r => r.food === 'good'), grp(r => r.food === 'low'), 'gut gegessen', 'zu wenig']
  ];
  let h = '';
  for(const [name, good, bad, gl, bl] of pairs){
    if(!good || !bad) continue;
    const mx = Math.max(Math.abs(good.avg), Math.abs(bad.avg), 1);
    const bar = (g, lab) => '<div class="corr-r"><span>' + lab + ' (' + g.n + '×)</span><div class="corr-b"><i class="' + (g.avg >= 0 ? 'pos' : 'neg') + '" style="width:' + (Math.abs(g.avg) / mx * 100).toFixed(0) + '%"></i></div><b class="num">' + (g.avg > 0 ? '+' : '') + fmt(Math.round(g.avg * 10) / 10) + ' %</b></div>';
    h += '<div class="corr"><span class="eyebrow">' + name + '</span>' + bar(good, gl) + bar(bad, bl) + '</div>';
  }
  if(!h) return '<p class="note">Sobald du mindestens 3 Trainings mit kurzem und 3 mit gutem Schlaf (bzw. Essen) eingetragen hast, vergleicht die App hier deine Leistung. Leistung = durchschnittliche Veränderung deiner Übungen gegenüber dem letzten Mal.</p>';
  return '<p class="note">Durchschnittliche Leistungsveränderung gegenüber dem letzten Mal, je nach Check-in:</p>' + h;
}

/* ---------- Live rep feedback ---------- */
function setTarget(it, si, n){
  if(it.amrap) return si === n - 1 ? '6+ (so viele wie möglich)' : '6 Wdh';
  return it.min + '–' + it.max + ' Wdh';
}
function feedbackFor(it, si, n, s){
  if(s.pre && !s.done) return {tone:'', text:'Letztes Mal ' + s.reps + ' Wdh · Ziel: ' + setTarget(it, si, n)};
  return setFeedback(it, si, n, s.reps);
}
function setFeedback(it, si, n, reps){
  if(reps == null) return {tone:'', text:'Ziel: ' + setTarget(it, si, n)};
  if(it.amrap){
    if(si === n - 1) return {tone:'', text:'Ziel: ' + setTarget(it, si, n)};
    return reps >= it.min ? {tone:'good', text:'✓ ' + reps + ' Wdh, passt'} : {tone:'warn', text:'Unter 6 Wdh: Gewicht ist heute zu schwer'};
  }
  if(reps >= it.max) return {tone:'good', text:'✓ Oberes Ende erreicht (' + it.max + ')'};
  if(reps >= it.min) return {tone:'info', text:'Im Bereich ' + it.min + '–' + it.max + ', noch ' + (it.max - reps) + ' bis zum oberen Ende'};
  return {tone:'warn', text:'Unter ' + it.min + ' Wdh: Gewicht zu schwer'};
}
function verdictHtml(e, it){
  const step = it.inc || 2.5;
  const kgNow = num(e.sets[e.sets.length - 1] && e.sets[e.sets.length - 1].kg) || num(e.sets[0] && e.sets[0].kg) || 0;
  if(it.amrap){
    const last = e.sets[e.sets.length - 1], r = last && (last.done || !last.pre) ? last.reps : null;
    const idx = r == null ? -1 : AMRAP_TABLE.findIndex(x => x.test(r));
    let h = '<div class="xr"><div class="xr-h">Steigerungsregel für den letzten Satz</div><div class="xr-grid">' +
      AMRAP_TABLE.map((x, i) => '<div class="xr-c' + (i === idx ? ' on ' + x.tone : '') + '"><b>' + x.lab + '</b><span>' + x.act + '</span></div>').join('') + '</div>';
    if(idx >= 0){
      const x = AMRAP_TABLE[idx], next = Math.max(0, kgNow + x.d);
      const txt = x.d > 0 ? 'Nächstes Mal mehr Gewicht: ' + fmt(next) + ' kg'
                : x.d < 0 ? 'Zu schwer. Nächstes Mal ' + fmt(next) + ' kg'
                : 'Im Bereich 4–7. Nächstes Mal ' + fmt(kgNow) + ' kg halten';
      h += '<p class="xr-v ' + x.tone + '">' + txt + '</p>';
    }else{
      h += '<p class="xr-v">Trag im letzten Satz deine Wdh ein, dann siehst du, was nächstes Mal dran ist.</p>';
    }
    return h + '</div>';
  }
  const withReps = e.sets.filter(s => s.reps != null && (s.done || !s.pre));
  const atTop = withReps.filter(s => s.reps >= it.max).length;
  const below = withReps.some(s => s.reps < it.min);
  let tone = '', txt;
  if(!withReps.length) txt = 'Steigern, sobald alle ' + e.sets.length + ' Sätze ' + it.max + ' Wdh schaffen.';
  else if(below){ tone = 'warn'; txt = 'Ein Satz unter ' + it.min + ' Wdh: Gewicht ist zu schwer. Nächstes Mal etwas leichter oder gleich lassen.'; }
  else if(withReps.length === e.sets.length && atTop === e.sets.length){ tone = 'good'; txt = 'Alle Sätze am oberen Ende. Nächstes Mal mehr Gewicht: ' + fmt(+(kgNow + step).toFixed(2)) + ' kg'; }
  else { tone = 'info'; txt = atTop + ' von ' + e.sets.length + ' Sätzen am oberen Ende (' + it.max + '). Gewicht halten, bis alle es schaffen.'; }
  return '<div class="xr"><div class="xr-h">Bereich ' + it.min + '–' + it.max + ' Wdh</div><p class="xr-v ' + tone + '">' + txt + '</p></div>';
}

/* ---------- Summary charts ---------- */
function setsChart(rows){
  const top = Math.max(20, ...rows.flatMap(r => r.sets.map(s => s.reps)));
  const pct = v => (v / top * 100).toFixed(1) + '%';
  let h = '<section class="card stack"><div><h4>Deine Sätze heute</h4><p class="note">Balken = Wiederholungen pro Satz · helles Feld = Zielbereich</p></div><div class="sx">';
  for(const r of rows){
    const lo = r.min, hi = r.amrap ? r.min : r.max;
    const same = r.sets.every(x => x.kg === r.sets[0].kg);
    h += '<div class="sx-row"><div class="sx-name"><b>' + esc(r.name) + '</b><span class="num">' + (same ? fmt(r.sets[0].kg) + ' kg' : r.sets.map(x => fmt(x.kg)).join(' / ') + ' kg') + ' · Ziel ' + (r.amrap ? '6+' : r.min + '–' + r.max) + '</span></div>' +
      '<div class="sx-plot"><span class="sx-band" style="bottom:' + pct(lo) + ';height:calc(' + pct(hi - lo) + ' + 2px)"></span>' +
      r.sets.map((x, i) => {
        const hit = r.amrap ? x.reps >= r.min : x.reps >= r.max;
        return '<span class="sx-bar' + (hit ? ' hit' : '') + '" style="height:' + pct(x.reps) + '" title="Satz ' + (i + 1) + ': ' + fmt(x.kg) + ' kg × ' + x.reps + '"><em class="num">' + x.reps + '</em></span>';
      }).join('') + '</div></div>';
  }
  return h + '</div><p class="note">Dunkler Balken = Ziel erreicht (oberes Ende bzw. 6+).</p></section>';
}
function trendChart(tr, name){
  let h = '<section class="card stack"><div><h4>Steigerung ' + esc(name) + '</h4><p class="note">Geschätztes Maximum für 1 Wiederholung, berechnet aus Gewicht und Wdh deines besten Satzes</p></div>';
  if(!tr || tr.length < 2){
    const v = tr && tr[0] ? fmt(Math.round(tr[0].v * 2) / 2) + ' kg' : '–';
    return h + '<div class="hero"><b class="num">' + v + '</b><span>Startwert. Ab dem nächsten Training siehst du hier deine Kurve.</span></div></section>';
  }
  const W = 320, H = 170, L = 34, R = 14, T = 18, B = 26;
  const vals = tr.map(p => p.v);
  let lo = Math.min(...vals), hi = Math.max(...vals);
  const pad = Math.max(2.5, (hi - lo) * 0.15); lo = Math.floor((lo - pad) / 2.5) * 2.5; hi = Math.ceil((hi + pad) / 2.5) * 2.5;
  const x = i => L + i * (W - L - R) / (tr.length - 1);
  const y = v => T + (1 - (v - lo) / (hi - lo)) * (H - T - B);
  const ticks = [lo, (lo + hi) / 2, hi];
  let svg = '<svg class="trend" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Verlauf ' + esc(name) + ' von ' + fmt(vals[0]) + ' auf ' + fmt(vals[vals.length - 1]) + ' kg">';
  svg += ticks.map(t => '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + y(t).toFixed(1) + '" y2="' + y(t).toFixed(1) + '" class="grid"/><text x="' + (L - 6) + '" y="' + (y(t) + 3.5).toFixed(1) + '" text-anchor="end" class="ax">' + fmt(Math.round(t)) + '</text>').join('');
  const d = tr.map((p, i) => (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(p.v).toFixed(1)).join(' ');
  svg += '<path d="' + d + ' L' + x(tr.length - 1).toFixed(1) + ' ' + (H - B) + ' L' + L + ' ' + (H - B) + ' Z" class="area"/>';
  svg += '<path d="' + d + '" class="line"/>';
  svg += tr.map((p, i) => '<g><circle cx="' + x(i).toFixed(1) + '" cy="' + y(p.v).toFixed(1) + '" r="' + (i === tr.length - 1 ? 5.5 : 4) + '" class="pt' + (i === tr.length - 1 ? ' last' : '') + '"/><circle cx="' + x(i).toFixed(1) + '" cy="' + y(p.v).toFixed(1) + '" r="14" fill="transparent"><title>' + fmtDate(p.date) + ': ' + fmt(p.top.kg) + ' kg × ' + p.top.reps + ' (≈ ' + fmt(Math.round(p.v * 2) / 2) + ' kg)</title></circle></g>').join('');
  const lp = tr[tr.length - 1];
  svg += '<text x="' + Math.min(x(tr.length - 1), W - R).toFixed(1) + '" y="' + (y(lp.v) - 10).toFixed(1) + '" text-anchor="end" class="val">' + fmt(Math.round(lp.v * 2) / 2) + ' kg</text>';
  svg += '<text x="' + L + '" y="' + (H - 6) + '" class="ax">' + fmtDate(tr[0].date) + '</text><text x="' + (W - R) + '" y="' + (H - 6) + '" text-anchor="end" class="ax">' + fmtDate(lp.date) + '</text></svg>';
  const diff = lp.v - tr[0].v;
  h += svg + '<p class="note">' + (diff > 0 ? 'Seit ' + fmtDate(tr[0].date) + ': <b style="color:var(--good)">+' + fmt(Math.round(diff * 2) / 2) + ' kg</b>. Weiter so.' : 'Noch keine Steigerung seit ' + fmtDate(tr[0].date) + '. Dranbleiben, das kommt.') + '</p></section>';
  return h;
}
function compareList(rows){
  let h = '<section class="card stack"><h4>Vergleich zum letzten Mal</h4><div class="cmp">';
  for(const r of rows){
    const now = perf(r.sets), nowTxt = fmt(now.maxKg) + ' kg · ' + r.sets.map(x => x.reps).join('/');
    let chip;
    if(!r.prev) chip = '<span class="chip info">Neu</span>';
    else{
      const p = perf(r.prev);
      if(now.maxKg > p.maxKg + 1e-9) chip = '<span class="chip good">↑ +' + fmt(now.maxKg - p.maxKg) + ' kg</span>';
      else if(now.maxKg < p.maxKg - 1e-9) chip = '<span class="chip warn">↓ ' + fmt(now.maxKg - p.maxKg) + ' kg</span>';
      else if(now.total > p.total) chip = '<span class="chip good">↑ +' + (now.total - p.total) + ' Wdh</span>';
      else if(now.total < p.total) chip = '<span class="chip warn">↓ ' + (now.total - p.total) + ' Wdh</span>';
      else chip = '<span class="chip info">→ gleich</span>';
    }
    h += '<div class="cmp-row"><div><b>' + esc(r.name) + '</b><span class="num">' + (r.prev ? 'vorher ' + fmt(perf(r.prev).maxKg) + ' kg · ' + r.prev.map(x => x.reps).join('/') + ' → ' : '') + 'heute ' + nowTxt + '</span></div>' + chip + '</div>';
  }
  return h + '</div></section>';
}
function durTable(rows){
  return '<section class="card stack"><h4>Dauer pro Übung</h4><p class="note">Gemessen von der vorherigen Übung bis zum letzten Satz, inklusive Pausen.</p><div class="cmp">' +
    rows.map(r => '<div class="cmp-row"><div><b>' + esc(r.name) + '</b><span class="num">' + (r.avg && r.avg.n > 1 ? 'Ø ' + mmss(r.avg.avg) + ' min aus ' + r.avg.n + ' Trainings' : 'Erster Messwert') + '</span></div><b class="num">' + mmss(r.dur) + ' min</b></div>').join('') + '</div></section>';
}
function spark(points){
  if(points.length < 2) return '<svg viewBox="0 0 110 34" aria-hidden="true"></svg>';
  const min = Math.min(...points), max = Math.max(...points), span = max - min || 1;
  const xy = points.map((p, i) => [4 + i * (102 / (points.length - 1)), 30 - ((p - min) / span) * 26]);
  const d = xy.map((q, i) => (i ? 'L' : 'M') + q[0].toFixed(1) + ' ' + q[1].toFixed(1)).join(' ');
  const lp = xy[xy.length - 1];
  return '<svg viewBox="0 0 110 34" aria-hidden="true"><path d="' + d + ' L' + lp[0].toFixed(1) + ' 34 L4 34 Z" fill="var(--accent-soft)"/><path d="' + d + '" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="' + lp[0].toFixed(1) + '" cy="' + lp[1].toFixed(1) + '" r="3" fill="var(--accent)"/></svg>';
}
function allExercises(){
  const seen = new Map();
  for(const wk of ['A','B','C']) for(const it of PLAN[wk].items){
    const list = it.variants ? it.variants.map(v => ({id:v.id, name:v.name})) : [{id:it.id, name:it.name}];
    for(const x of list) if(!seen.has(x.id)) seen.set(x.id, x.name);
  }
  return [...seen].map(([id, name]) => ({id, name}));
}
function renderHistory(){
  let h = '<header class="bar"><button class="ghost" data-act="go" data-v="home">‹ Start</button><h1>Verlauf</h1></header><div class="stack">';
  h += '<div class="tabs" role="group" aria-label="Ansicht"><button data-act="tab" data-v="sessions" aria-pressed="' + (histTab === 'sessions') + '">Trainings</button><button data-act="tab" data-v="exercises" aria-pressed="' + (histTab === 'exercises') + '">Übungen</button><button data-act="tab" data-v="recovery" aria-pressed="' + (histTab === 'recovery') + '">Schlaf & Essen</button></div>';
  if(histTab === 'recovery') return h + renderRecovery() + '</div>';
  if(!S.sessions.length) return h + '<section class="card"><p class="note">Noch keine Trainings gespeichert. Nach deinem ersten Training siehst du hier jede Einheit und deine Entwicklung pro Übung.</p></section></div>';
  if(histTab === 'sessions'){
    h += S.sessions.slice().reverse().map(s => {
      const done = s.entries.reduce((n, e) => n + e.sets.filter(x => x.done).length, 0);
      const mins = Math.round((s.end - s.start) / 60000);
      const lines = s.entries.filter(e => e.sets.some(x => x.done)).map(e => {
        const d = e.sets.filter(x => x.done);
        const same = d.every(x => x.kg === d[0].kg);
        const txt = same ? fmt(d[0].kg) + ' kg · ' + d.map(x => x.reps).join('/') : d.map(x => fmt(x.kg) + '×' + x.reps).join(', ');
        return '<div class="l"><span>' + esc(e.name) + '</span><span class="num">' + txt + '</span></div>';
      }).join('');
      const del = confirmKey === 'del-' + s.id
        ? '<div class="row"><button class="btn danger" data-act="del2" data-id="' + s.id + '">Endgültig löschen</button><button class="btn" data-act="cancel">Abbrechen</button></div>'
        : '<button class="addset" style="color:var(--danger)" data-act="del" data-id="' + s.id + '">Training löschen</button>';
      return '<details class="sess"' + (confirmKey === 'del-' + s.id ? ' open' : '') + '><summary>' + plateEl(s.wk) + '<div class="sess-t"><b>' + fmtDate(s.start) + ' · Workout ' + s.wk + '</b><span class="num">' + mins + ' min · ' + done + ' Sätze</span></div></summary><div class="sess-body">' + lines + del + '</div></details>';
    }).join('');
  }else{
    h += '<p class="note">Kurve = bester Satz je Training (geschätztes Maximum aus Gewicht und Wdh).</p><div class="exlist">';
    for(const ex of allExercises()){
      const hist = histFor(ex.id);
      if(!hist.length) continue;
      const pts = hist.map(x => { const p = perf(x.sets); return p.maxKg > 0 ? p.e1 : p.total; });
      const last = hist[hist.length - 1], lp = perf(last.sets);
      h += '<div class="exitem"><b>' + esc(ex.name) + '</b>' + spark(pts.slice(-12)) + '<span class="num">Zuletzt ' + fmt(lp.maxKg) + ' kg · ' + last.sets.map(x => x.reps).join('/') + ' · ' + hist.length + '× trainiert' + (avgDur(ex.id) ? ' · Ø ' + mmss(avgDur(ex.id).avg) + ' min' : '') + '</span></div>';
    }
    h += '</div>';
  }
  return h + '</div>';
}

  h += '<section class="card set-group"><div class="eyebrow">Alles zurücksetzen</div>' +
    (confirmKey === 'wipe'
      ? '<p class="note">Alle Trainings und Einstellungen werden gelöscht. Das lässt sich nicht rückgängig machen.</p><div class="row"><button class="btn danger" data-act="wipe2">Alles löschen</button><button class="btn" data-act="cancel">Abbrechen</button></div>'
      : '<button class="btn danger" data-act="wipe">Alle Daten löschen</button>') + '</section>';
  return h + '</div>';
}

/* ---------- Events ---------- */
function copyText(txt, okMsg){
  const fallback = () => { importText = txt; if(view === 'settings'){ render(); const t = $('#importbox'); if(t){ t.focus(); t.select(); } } toast('Text markiert. Jetzt kopieren.'); };
  try{ navigator.clipboard.writeText(txt).then(() => toast(okMsg), fallback); }catch(e){ fallback(); }
}
document.addEventListener('pointerdown', unlockAudio, {passive:true});
document.addEventListener('keydown', ev => { if(ev.key === 'Escape' && !$('#sheet').hidden) closeSheet(); });
$('#sheet').addEventListener('click', ev => { if(ev.target.id === 'sheet') closeSheet(); });
document.addEventListener('click', ev => {
  const b = ev.target.closest('[data-act]');
  if(!b) return;
  const act = b.dataset.act, a = S.active;
  const ei = +b.dataset.ei, si = +b.dataset.si;
  switch(act){
    case 'start': if(!S.active) startSession(b.dataset.wk); else toast('Es läuft schon ein Training.'); break;
    case 'resume': view = 'session'; render(); requestWake(); break;
    case 'go': view = b.dataset.v; confirmKey = null; render(); window.scrollTo(0, 0); break;
    case 'tab': histTab = b.dataset.v; confirmKey = null; render(); break;
    case 'plan': planSheet(); break;
    case 'info': { const e = a.items[ei]; exerciseSheet(e.exId, e.name); break; }
    case 'close': closeSheet(); break;
    case 'chk': toggleSet(ei, si); break;
    case 'warm': toggleWarm(ei, si); break;
    case 'addset': { const e = a.items[ei], l = e.sets[e.sets.length - 1]; e.sets.push({kg: l ? l.kg : null, reps: null, done: false, ph: null}); save(); render(); break; }
    case 'day': daySheet(+b.dataset.ts); break;
    case 'daytype': {
      const ts = +b.dataset.ts, k = dateKey(ts), every = document.getElementById('everyweek');
      if(every && every.checked){ S.settings.schedule[wdIdx(ts)] = b.dataset.t; delete S.weekPlan[k]; }
      else if(b.dataset.t === S.settings.schedule[wdIdx(ts)]) delete S.weekPlan[k];
      else S.weekPlan[k] = b.dataset.t;
      save(); closeSheet(); render(); toast(DAYS_LONG[wdIdx(ts)] + ': ' + TYPES[b.dataset.t]); break;
    }
    case 'dayreset': { delete S.weekPlan[dateKey(+b.dataset.ts)]; save(); closeSheet(); render(); break; }
    case 'wsave': {
      const v = num($('#wkg').value);
      if(v == null || v < 30 || v > 300){ toast('Bitte ein Gewicht zwischen 30 und 300 kg eingeben.'); break; }
      const k = dateKey(Date.now()), ex = S.weights.find(x => dateKey(x.date) === k);
      if(ex){ ex.kg = v; ex.date = Date.now(); } else S.weights.push({date: Date.now(), kg: v});
      S.weights.sort((x, y) => x.date - y.date);
      save(); render(); toast('Gewicht gespeichert'); break;
    }
    case 'wgoal': { const v = num($('#wgoal').value); S.weightGoal = v && v > 30 && v < 300 ? v : null; save(); render(); toast(S.weightGoal ? 'Ziel gespeichert' : 'Ziel entfernt'); break; }
    case 'wdel': confirmKey = 'wdel-' + b.dataset.d; render(); break;
    case 'wdel2': S.weights = S.weights.filter(x => String(x.date) !== b.dataset.d); confirmKey = null; save(); render(); break;
    case 'photo': confirmKey = null; photoSheet(b.dataset.id); break;
    case 'pdel': confirmKey = 'pdel-' + b.dataset.id; photoSheet(b.dataset.id); break;
    case 'pdel2': {
      const id = b.dataset.id; S.photos = S.photos.filter(x => x.id !== id); delete photoData[id];
      PDB.del(id).catch(() => {}); confirmKey = null; save(); closeSheet(); render(); toast('Foto gelöscht'); break;
    }
    case 'ci': {
      a.checkin = a.checkin || {};
      a.checkin[b.dataset.k] = a.checkin[b.dataset.k] === b.dataset.v ? undefined : b.dataset.v;
      if(a.checkin[b.dataset.k] === undefined) delete a.checkin[b.dataset.k];
      save(); render(); break;
    }
    case 'ciopen': a.ciOpen = true; render(); break;
    case 'ciclose': a.ciOpen = false; save(); render(); break;
    case 'hidehint': S.hintsHidden[b.dataset.k] = Date.now(); save(); render(); break;
    case 'applysugg': {
      const e = a.items[ei], kg = e.sugg.kg;
      e.sets.forEach(s => { if(!s.done) s.kg = kg; });
      const it = itemOf(e);
      (e.warm || []).forEach(w => { if(!w.done && w.p) w.kg = warmKg(kg, w.p, it); });
      save(); render(); toast(fmt(kg) + ' kg eingetragen'); break;
    }
    case 'exdone': $('#exdone').hidden = true; break;
    case 'delset': { const e = a.items[ei]; if(e.sets.length > 1){ e.sets.pop(); save(); render(); toast('Letzter Arbeitssatz entfernt'); } break; }
    case 'delwarm': { const e = a.items[ei]; if(e.warm && e.warm.length){ e.warm.pop(); save(); render(); toast('Letzter Aufwärmsatz entfernt'); } break; }
    case 'addwarm': { const e = a.items[ei]; e.warm = e.warm || []; e.warm.push({kg: null, reps: null, done: false, auto: false}); save(); render(); break; }
    case 'variant': {
      const e = a.items[ei], it = itemOf(e);
      if(e.sets.some(s => s.done)) break;
      S.settings.variants[it.id] = b.dataset.v;
      a.items[ei] = buildEntry(it, ei, a.phase);
      save(); render(); break;
    }
    case 'timer': {
      if(!a || !a.timer) break;
      if(b.dataset.v === 'skip'){ a.timer = null; }
      else { const d = +b.dataset.v * 1000; a.timer.end = Math.max(Date.now() + 1000, a.timer.end + d); a.timer.total = Math.max(1, a.timer.total + d / 1000); a.timer.fired = false; }
      save(); tick(); break;
    }
    case 'dayDone': { const k = dateKey(Date.now()); if(S.days[k]) delete S.days[k]; else S.days[k] = true; save(); render(); break; }
    case 'flex': {
      const k = dateKey(Date.now()), fk = k + ':flex', fl = S.days[fk] || [];
      fl[+b.dataset.i] = !fl[+b.dataset.i]; S.days[fk] = fl;
      if(FLEX.every((_, i) => fl[i])){ S.days[k] = true; toast('Flex erledigt. Gut gemacht!'); } else delete S.days[k];
      save(); render(); break;
    }
    case 'end': confirmKey = 'end'; render(); window.scrollTo({top:0, behavior:'smooth'}); break;
    case 'finish': finishSession(); break;
    case 'discard': confirmKey = 'discard'; render(); break;
    case 'discard2': S.active = null; confirmKey = null; save(); releaseWake(); view = 'home'; render(); toast('Training verworfen'); break;
    case 'cancel': confirmKey = null; render(); break;
    case 'del': confirmKey = 'del-' + b.dataset.id; render(); break;
    case 'del2': S.sessions = S.sessions.filter(s => s.id !== b.dataset.id); confirmKey = null; save(); render(); toast('Training gelöscht'); break;
    case 'testsound': unlockAudio(); alarm(); break;
    case 'copyquotes': copyText(QUOTES.map(q => '„' + q[0] + '“ – ' + q[1]).join('\n'), 'Zitate kopiert'); break;
    case 'copy': copyText(JSON.stringify(S), 'Backup kopiert'); break;
    case 'download': shareBackup(); break;
    case 'hello': $('#hello').hidden = true; break;
    case 'import': checkImport(importText); break;
    case 'import2': {
      try{ const raw = unwrapBackup(JSON.parse(importText)); S = normalize(raw);
        if(raw.photoData) for(const [id, d] of Object.entries(raw.photoData)){ photoData[id] = d; PDB.put(id, d).catch(() => {}); }
        importText = ''; confirmKey = null; save(); applyTheme(); view = 'home'; render(); toast('Backup geladen'); }
      catch(e){ toast('Das ist kein gültiges Backup.'); }
      break;
    }
    case 'wipe': confirmKey = 'wipe'; render(); break;
    case 'wipe2': for(const p of S.photos){ PDB.del(p.id).catch(() => {}); delete photoData[p.id]; } S = normalize({}); confirmKey = null; save(); view = 'home'; render(); toast('Alle Daten gelöscht'); break;
  }
});
const autoDone = {};
document.addEventListener('input', ev => {
  const t = ev.target, a = S.active;
  const ref = t.dataset.kg || t.dataset.reps;
  if(ref && a){
    const [kind, eiS, siS] = ref.split('-'), ei = +eiS, si = +siS, e = a.items[ei];
    const list = kind === 'w' ? e.warm : e.sets, row = list[si], v = num(t.value);
    if(t.dataset.reps){
      row.reps = v == null ? null : Math.round(v); row.pre = false;
      t.closest('.set').classList.remove('pre');
      save();
      if(kind === 's'){
        updateFeedback(ei);
        /* Entering reps finishes the set: start the rest timer once typing pauses */
        clearTimeout(autoDone[ref]);
        if(!row.done && row.reps != null && row.reps > 0){
          autoDone[ref] = setTimeout(() => {
            const cur = S.active && S.active.items[ei] && S.active.items[ei].sets[si];
            if(cur && !cur.done && cur.reps > 0) toggleSet(ei, si);
          }, 1500);
        }
      }
      return;
    }
    row.kg = v;
    if(kind === 'w'){ row.auto = false; save(); return; }
    setTimeout(() => updateFeedback(ei), 0);
    for(let j = si + 1; j < e.sets.length; j++){
      if(!e.sets[j].done){ e.sets[j].kg = v; const inp = document.getElementById('kg-s-' + ei + '-' + j); if(inp) inp.value = t.value; }
    }
    if(si === 0 && e.warm){
      const it = itemOf(e);
      e.warm.forEach((w, wi) => {
        if(!w.auto || w.done || !w.p) return;
        w.kg = warmKg(v, w.p, it);
        const inp = document.getElementById('kg-w-' + ei + '-' + wi); if(inp) inp.value = w.kg != null ? fmt(w.kg) : '';
      });
    }
    save();
  }else if(t.hasAttribute('data-import')){
    importText = t.value;
  }else if(t.dataset.set && t.type === 'number'){
    const v = num(t.value); if(v != null && v >= 15 && v <= 900){ S.settings[t.dataset.set] = Math.round(v); save(); }
  }
});
let importInfo = '';
function checkImport(txt){
  try{
    const d = unwrapBackup(JSON.parse(txt));
    const last = d.sessions.length ? d.sessions[d.sessions.length - 1] : null;
    importInfo = d.sessions.length + (d.sessions.length === 1 ? ' Training' : ' Trainings') +(last ? ', letztes am ' + new Date(last.start).toLocaleDateString('de-DE') : '') + '.';
    importText = txt; confirmKey = 'import'; render();
  }catch(e){ toast('Das ist kein gültiges Backup.'); }
}
document.addEventListener('change', ev => {
  const t = ev.target;
  if(t.id === 'photoin'){
    const f = t.files && t.files[0]; t.value = '';
    if(f) addPhoto(f);
    return;
  }
  if(t.id === 'importfile'){
    const f = t.files && t.files[0]; if(!f) return;
    const r = new FileReader();
    r.onload = () => checkImport(String(r.result || ''));
    r.onerror = () => toast('Datei konnte nicht gelesen werden.');
    r.readAsText(f); t.value = '';
    return;
  }
  if(t.dataset.set === 'theme'){ S.settings.theme = t.value; save(); applyTheme(); render(); return; }
  if(t.dataset.sched != null){ S.settings.schedule[+t.dataset.sched] = t.value; save(); render(); return; }
  if(!t.dataset.set) return;
  if(t.type === 'checkbox') S.settings[t.dataset.set] = t.checked;
  else if(t.tagName === 'SELECT') S.settings[t.dataset.set] = t.value;
  else return;
  save(); render();
});

try{ if('serviceWorker' in navigator && window.top === window.self && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {}); }catch(e){}

applyTheme();
render();
greet();
loadPhotos();
if(S.active) requestWake();
})();
</script>
